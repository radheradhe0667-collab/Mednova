name: Build MedNova APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MedNova-Android-Project-v1.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract MedNova project
        run: |
          unzip -o MedNova-Android-Project-v1.zip
          cd MedNova
          gradle wrapper --gradle-version 8.7

      - name: Build APK
        working-directory: MedNova
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedNova-APK
          path: MedNova/app/build/outputs/apk/debug/app-debug.apk
